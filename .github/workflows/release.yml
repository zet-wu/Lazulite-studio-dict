name: Prepare or publish dictionaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching packages.json
        required: true
        default: v0.1.0
        type: string
      action:
        description: Prepare first; publish only after reviewing the actual draft assets
        type: choice
        default: prepare-draft
        options:
          - prepare-draft
          - publish-reviewed-draft
permissions:
  contents: read
concurrency:
  group: dictionaries-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_ACTION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          elif [ "$RELEASE_ACTION" = "publish-reviewed-draft" ]; then
            target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
            commit=$(git rev-parse --verify "$target^{commit}")
          else
            commit="$SOURCE_COMMIT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    if: inputs.action == 'prepare-draft'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dictionaries-sources-${{ runner.os }}-${{ github.sha }}
          restore-keys: dictionaries-sources-${{ runner.os }}-
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_contract.py tests/test_release.py
      - run: python -m dictbuilder build --all
      - run: python -m pytest -q tests/test_full_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dictionaries
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictionary-diagnostics
          path: reports/
          if-no-files-found: warn
  release:
    needs: [source, build]
    if: always() && needs.source.result == 'success' && (needs.build.result == 'success' || inputs.action == 'publish-reviewed-draft')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: inputs.action == 'prepare-draft'
        with:
          name: dictionaries
          path: dist
      - name: Prepare draft
        if: inputs.action == 'prepare-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python -m dictbuilder.release --assets dist
      - name: Publish reviewed draft
        if: inputs.action == 'publish-reviewed-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python -m dictbuilder.release --publish-reviewed
